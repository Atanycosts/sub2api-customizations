name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v6
      - name: Check deployment scripts
        run: |
          /bin/bash -n deploy/apple-container.sh
          /bin/bash deploy/tests/apple-container-test.sh
          /bin/sh deploy/tests/docker-compose-security-test.sh
          /bin/sh deploy/tests/docker-compose-gateway-env-test.sh
          /bin/sh deploy/tests/docker-runtime-resources-test.sh
          /bin/sh deploy/test-caddyfile-cache.sh
          /bin/bash -n deploy/publish-production.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check Docker Compose simple mode environment
        run: /bin/sh deploy/tests/docker-compose-simple-mode-env-test.sh
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.27.4'
      - name: Unit tests
        working-directory: backend
        run: make test-unit
      - name: Integration tests
        working-directory: backend
        run: make test-integration

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Frontend typecheck and critical vitest
        run: make test-frontend

  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.27.4'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          args: --timeout=30m
          working-directory: backend

  release-helpers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r .github/release-tools/requirements-release.txt
      - run: python -m unittest discover -s .github/release-tools -p 'test_release_matrix.py'
      - name: Check account-memory deployment Python
        run: python -m py_compile deploy/provision-account-memory.py deploy/memory-embeddings.py deploy/tests/memory-embeddings-smoke.py deploy/backup-production.py
      - run: bash -n .github/release-tools/release-images.sh

  production-artifact:
    needs: [shell, test, frontend, golangci-lint, release-helpers]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Set production version
        run: printf 'VERSION=%s-gateway-%s\n' "$(./backend/scripts/resolve-version.sh)" "$GITHUB_SHA" >> "$GITHUB_ENV"
      - name: Build embedded production binary
        run: |
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend run build
          mkdir -p production-artifact
          cp -R backend/resources production-artifact/resources
          cd backend
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -tags embed -trimpath \
            -ldflags "-s -w -X main.Version=$VERSION -X main.Commit=$GITHUB_SHA -X main.BuildType=release" \
            -o ../production-artifact/sub2api ./cmd/server
      - name: Record exact commit and asset hashes
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re
          binary = pathlib.Path('production-artifact/sub2api')
          root = pathlib.Path('backend/internal/web/dist')
          resources = pathlib.Path('production-artifact/resources')
          entry = re.search(r'/assets/index-[A-Za-z0-9_-]+\.js', (root / 'index.html').read_text()).group()
          manifest = {
              'version': os.environ['VERSION'], 'commit': os.environ['GITHUB_SHA'],
              'source_dirty': False, 'entry': entry,
              'binary_sha256': hashlib.sha256(binary.read_bytes()).hexdigest(),
              'assets': {'/' + str(p.relative_to(root)): hashlib.sha256(p.read_bytes()).hexdigest()
                         for p in root.rglob('*') if p.is_file()
                         and p.suffix in {'.js', '.css', '.svg', '.png', '.webp', '.woff2'}},
              'resources': {str(p.relative_to(resources)): hashlib.sha256(p.read_bytes()).hexdigest()
                            for p in resources.rglob('*') if p.is_file()},
          }
          pathlib.Path(str(binary) + '.manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: production-linux-amd64-${{ github.sha }}
          path: production-artifact/
          retention-days: 14
